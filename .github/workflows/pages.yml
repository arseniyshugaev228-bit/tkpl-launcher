name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Сайт лежит в html/ и ссылается на ../css, ../js, ../downloads.
      # Для Pages кладём index.html в корень и переписываем пути на ./
      - name: Собрать сайт
        run: |
          mkdir _site
          cp -r css js downloads _site/
          sed 's#"\.\./\(css\|js\|downloads\)/#"./\1/#g' html/index.html > _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
